<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Love Gallery</title>
    <!-- Google Fonts for romantic typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Ambient glowing heart particles canvas -->
    <canvas id="ambient-canvas"></canvas>
    
    <div class="glow-bg"></div>

    <!-- Main Container -->
    <main class="gallery-container">
        
        <!-- 1. Intro Screen -->
        <section id="intro-screen" class="screen active">
            <div class="intro-content">
                <h1 class="intro-title">Welcome to Love Gallery</h1>
                <p class="intro-subtitle">Our cherished memories, captured in time</p>
            </div>
            <button id="btn-start" class="start-btn" aria-label="Enter Gallery">
                <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </section>

        <!-- 2. Section Selection Screen -->
        <section id="sections-screen" class="screen">
            <div class="sections-header">
                <h2 class="sections-title">Memory Collections</h2>
                <p class="sections-subtitle">Select a chapter to explore</p>
            </div>

            <div class="cards-grid">
                <!-- Card 1: Colophon -->
                <div class="section-card" data-section="colophon">
                    <div class="card-image-wrap">
                        <img src="images/colophon_cover.jpg" alt="Colophon Collection" class="card-cover">
                        <div class="card-overlay"></div>
                    </div>
                    <div class="card-info">
                        <h3 class="card-name">Colophon</h3>
                        <p class="card-desc">Words, reflections & thoughts</p>
                        <span class="card-pill">Open Collection &rarr;</span>
                    </div>
                </div>

                <!-- Card 2: Important Memories -->
                <div class="section-card" data-section="important_memories">
                    <div class="card-image-wrap">
                        <img src="images/memories_cover.jpg" alt="Important Memories Collection" class="card-cover">
                        <div class="card-overlay"></div>
                    </div>
                    <div class="card-info">
                        <h3 class="card-name">Important Memories</h3>
                        <p class="card-desc">Milestones & precious moments</p>
                        <span class="card-pill">Open Collection &rarr;</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 3. Image Gallery Screen -->
        <section id="gallery-screen" class="screen">
            <!-- Top bar with Back button and Collection title -->
            <header class="gallery-header">
                <button id="btn-back" class="back-btn" aria-label="Back to Collections">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Collections</span>
                </button>
                <div id="gallery-category-title" class="category-header-title">Colophon</div>
            </header>

            <!-- Screen tap zones for effortless mobile navigation -->
            <div id="tap-zone-prev" class="tap-zone left-zone" aria-label="Previous Image"></div>
            <div id="tap-zone-next" class="tap-zone right-zone" aria-label="Next Image"></div>

            <div class="image-stage">
                <!-- Stacked images for smooth crossfade -->
                <img id="img-active" class="gallery-img active" src="" alt="Memory Photo">
                <img id="img-next" class="gallery-img" src="" alt="Next Memory Photo">

                <!-- Soft romantic loading indicator -->
                <div id="loading-spinner" class="loading-spinner hidden">
                    <div class="heart-pulse"></div>
                </div>
            </div>

            <!-- Soft minimal photo counter -->
            <div id="gallery-counter" class="gallery-counter">
                <span id="current-index">1</span> <span class="divider">/</span> <span id="total-count">0</span>
            </div>
        </section>

    </main>

    <!-- Floating Navigation Controls in Gallery -->
    <nav id="nav-controls" class="nav-container hidden">
        <button id="btn-prev" class="nav-btn prev-btn hidden" aria-label="Previous image" title="Previous">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </button>

        <button id="btn-next" class="nav-btn next-btn" aria-label="Next image" title="Next">
            <!-- Right arrow icon -->
            <svg id="icon-arrow" class="nav-icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
            <!-- Replay icon -->
            <svg id="icon-replay" class="nav-icon hidden" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6"></path>
                <path d="M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
            </svg>
        </button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
